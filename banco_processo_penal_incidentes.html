<script>
const QUESTOES = [{"num": 1, "exame": "OAB – estilo FGV", "titulo": "Questão Prejudicial Devolutória Obrigatória", "enunciado": "Em um processo por crime de bigámia, surge controvérsia séria e fundada sobre o estado civil do acusado, da qual depende a prova da existência da infração penal.", "comando": "Segundo o CPP, nessa hipótese o juiz criminal deve:", "alt": {"A": "Julgar ele mesmo a questão do estado civil, pois o juiz penal tem competência para decidir toda e qualquer questão incidental.", "B": "Suspender obrigatoriamente o curso do processo-crime até que a questão do estado civil seja definitivamente resolvida no juízo cível, se a ação civil respectiva já tiver sido proposta ou vier a sê-lo no prazo fixado.", "C": "Absolver sumariamente o acusado, pois a existência de questão prejudicial extingue a ação penal.", "D": "Remeter os autos ao Tribunal de Justiça para que decida a questão prejudicial."}, "gabarito": "B", "fb": {"A": "Incorreta. Quando a questão prejudicial versar sobre ESTADO CIVIL das pessoas, a suspensão do processo é OBRIGATória — o juiz penal não pode decidir essa questão sozinho.", "B": "Correta! Art. 92, CPP: se a questão prejudicial versar sobre o estado civil das pessoas, o juiz criminal suspenderá o curso do processo, até que no juízo cível seja resolvida a questão, se já estiver proposta a ação civil respectiva ou vier a sê-lo no prazo que o juiz fixar.", "C": "Incorreta. A suspensão não é absolvição — apenas paralisa o processo até a definição da questão prejudicial na esfera competente.", "D": "Incorreta. Não há remessa ao Tribunal — a questão do estado civil vai para o JUÍZO CÍVEL competente, permanecendo o processo penal apenas suspenso perante o próprio juiz criminal."}, "fund": "Art. 92, CPP.", "caqui": "A questão prejudicial DEVOLUTÓRIA (porque devolve a decisão a outro juízo) é OBRIGATÓRIA quando versa sobre ESTADO CIVIL das pessoas (casamento, filiação, etc.) — o juiz penal NÃO TEM ESCOLHA, deve suspender. Isso porque o estado civil tem regras probatórias e efeitos erga omnes tão específicos que a lei retira do juiz criminal a competência para decidir incidentalmente sobre ele."}, {"num": 2, "exame": "CESPE – estilo", "titulo": "Questão Prejudicial Facultativa", "enunciado": "Em um processo por crime contra a propriedade, discute-se, de forma séria e fundada, questão sobre a existência de determinado direito real sobre o bem, cuja solução dependeria de prova cuja produção é exclusiva do juízo cível.", "comando": "Nessa hipótese, segundo o art. 93 do CPP, o juiz criminal:", "alt": {"A": "Deve obrigatoriamente suspender o processo, tal como ocorre nas questões de estado civil.", "B": "Pode, ouvido o Ministério Público, suspender o curso do processo, mediante prazo razoável que fixar, se não houver sido proposta a ação civil.", "C": "Não pode, em hipótese alguma, suspender o processo penal por questões diversas do estado civil.", "D": "Deve extinguir o processo penal sem resolução do mérito."}, "gabarito": "B", "fb": {"A": "Incorreta. Fora da hipótese de estado civil (art. 92), a suspensão é FACULTATIVA, não obrigatória.", "B": "Correta! Art. 93, CPP: se o reconhecimento da existência da infração penal depender de decisão sobre questão diversa do estado civil, cuja apreciação seja de competência exclusiva do juízo cível, o curso da ação penal poderá ficar suspenso, ouvido o MP, mediante prazo razoável que o juiz fixar. É uma faculdade do juiz, não uma obrigação.", "C": "Incorreta. É possível sim suspender, mas como faculdade do juiz, não como imposição legal automática.", "D": "Incorreta. Não há extinção — apenas suspensão facultativa, e o processo retoma seu curso normalmente após a decisão cível ou o decurso do prazo."}, "fund": "Art. 93, caput e §§1º e 2º, CPP.", "caqui": "Compare os dois artigos-irmãos: art. 92 (ESTADO CIVIL) = suspensão OBRIGATÓRIA, sem necessidade de audiência do MP. Art. 93 (OUTRAS questões de competência exclusiva do cível) = suspensão FACULTATIVA, exige oitiva prévia do MP e fixação de PRAZO RAZOÁVEL. A palavra-chave que diferencia as duas hipóteses na prova é sempre “estado civil” x “outra questão qualquer”."}, {"num": 3, "exame": "OAB – estilo FGV", "titulo": "Competência para Resolver Questões Prejudiciais", "enunciado": "Como regra geral, as questões prejudiciais que surgem no curso do processo penal são resolvidas por qual autoridade judiciária?", "comando": "Assinale a alternativa correta, segundo o art. 94 do CPP.", "alt": {"A": "Sempre pelo Tribunal de Justiça, mediante incidente processual específico.", "B": "Pelo próprio juiz criminal, salvo as exceções expressas do Código (como a do estado civil, que pode gerar suspensão obrigatória para o juízo cível).", "C": "Exclusivamente pelo Ministério Público, em manifestação vinculante.", "D": "Pelo juiz cível, em todo e qualquer caso, ainda que não verse sobre estado civil."}, "gabarito": "B", "fb": {"A": "Incorreta. Não há remessa ao Tribunal para resolver questão prejudicial — isso é atribuição do próprio juízo de primeiro grau (criminal ou, nas hipóteses do art. 92/93, cível).", "B": "Correta! Art. 94, CPP: “A suspensão do curso da ação penal, nos casos dos dois artigos anteriores, será decretada pelo juiz, de ofício ou a requerimento das partes”. A regra é: o juiz criminal resolve as questões prejudiciais como regra, só as devolvendo ao cível nas hipóteses específicas dos arts. 92 e 93.", "C": "Incorreta. O MP é apenas ouvido nas hipóteses facultativas (art. 93), sem poder de decisão vinculante sobre a suspensão.", "D": "Incorreta. O juízo cível só entra nas hipóteses específicas dos arts. 92 e 93 — não em toda e qualquer questão prejudicial."}, "fund": "Art. 94, CPP.", "caqui": "Regra geral do sistema brasileiro: o juiz penal tem PLENA COMPETêncIA para resolver, incidentalmente, praticamente qualquer questão necessária ao julgamento da causa penal (princípio da SUFICIÊNCIA da jurisdição penal). As exceções (arts. 92 e 93, que devolvem a questão ao cível) são TAXATIVAS e restritas."}, {"num": 4, "exame": "CESPE – estilo", "titulo": "Rol das Exceções no Processo Penal", "enunciado": "O art. 95 do CPP prevê um rol de exceções que podem ser opostas no processo penal.", "comando": "Assinale a alternativa que contém, CORRETA e EXCLUSIVAMENTE, as exceções previstas nesse artigo.", "alt": {"A": "Suspeição, incompetência de juízo, litispendência, ilegitimidade de parte e coisa julgada.", "B": "Suspeição, prescrição, decadência, litispendência e coisa julgada.", "C": "Incompetência de juízo, nulidade absoluta, nulidade relativa e preclusão.", "D": "Ilegitimidade de parte, falta de justa causa, atipicidade e excludente de ilicitude."}, "gabarito": "A", "fb": {"A": "Correta! Art. 95, CPP: podem ser opostas as exceções de suspeição, de incompetência de juízo, de litispendência, de ilegitimidade de parte e de coisa julgada.", "B": "Incorreta. Prescrição e decadência são causas de EXTINÇÃO DA PUNIBILIDADE, alegáveis a qualquer tempo, mas não estão no rol das exceções processuais do art. 95.", "C": "Incorreta. Nulidades e preclusão são institutos distintos das exceções processuais, tratados em capítulos próprios do CPP.", "D": "Incorreta. Falta de justa causa, atipicidade e excludentes de ilicitude são matéria de mérito ou de condição da ação, argüíveis por outros meios (habeas corpus, resposta à acusação), não são exceções do art. 95."}, "fund": "Art. 95, CPP.", "caqui": "Memorize o rol do art. 95 com o mnemônico <b>S-I-L-I-C</b>: Suspeição, Incompetência de juízo, Litispendência, Ilegitimidade de parte, Coisa julgada. São exatamente 5 exceções, rol TAXATIVO. Não confunda com as matérias de defesa de mérito, que se discutem na própria resposta à acusação ou em preliminar de sentença, não via exceção processual."}, {"num": 5, "exame": "OAB – estilo FGV", "titulo": "Momento para Opor Exceção de Suspeição", "enunciado": "Um advogado deseja opor exceção de suspeição contra o juiz da causa, alegando amizade íntima entre o magistrado e a vítima, fato que já era de seu conhecimento desde o início do processo.", "comando": "Segundo o CPP, essa exceção de suspeição deve ser oposta:", "alt": {"A": "A qualquer tempo, sem qualquer restrição, mesmo após já opostas outras exceções ou praticados outros atos no processo.", "B": "Antes de qualquer outra exceção ou manifestação defensiva, sob pena de preclusão, salvo se fundada em motivo superveniente.", "C": "Somente após a sentença de primeiro grau, como preliminar de apelação.", "D": "Exclusivamente na fase de inquérito policial, sendo vedada sua oposição na fase processual."}, "gabarito": "B", "fb": {"A": "Incorreta. Se o motivo já era conhecido, a exceção de suspeição deve ser oposta ANTES de qualquer outro ato ou exceção — caso contrário, há preclusão.", "B": "Correta! Art. 96, CPP: a exceção de suspeição precede qualquer outra, salvo quando fundada em motivo superveniente. Como a amizade íntima já era conhecida desde o início, o advogado deveria tê-la oposto logo de cara — se não o fez, pode ter havido preclusão (embora questões de ordem pública sobre imparcialidade possam, em tese, ainda ser discutidas por outras vias, como HC).", "C": "Incorreta. Não há essa exigência de aguardar a sentença — a suspeição deve ser resolvida incidentalmente, antes do julgamento.", "D": "Incorreta. A suspeição pode ser oposta durante a fase processual, perante o próprio juiz da causa — não é exclusiva do inquérito."}, "fund": "Art. 96, CPP.", "caqui": "Regra de ouro: a exceção de suspeição é a “primeira da fila” — deve ser oposta ANTES de qualquer outra manifestação no processo, se o motivo já for conhecido. Só escapa dessa ordem quando o motivo for SUPERVENIENTE (surgiu depois), caso em que pode ser oposta a qualquer tempo, assim que a parte tomar conhecimento dele."}, {"num": 6, "exame": "CESPE – estilo", "titulo": "Reconhecimento de Ofício da Suspeição", "enunciado": "Um juiz, percebendo que é amigo íntimo do réu em um processo sob sua responsabilidade, decide agir independentemente de provocação das partes.", "comando": "Segundo o CPP, ao reconhecer motivo de impedimento ou suspeição em relação a si mesmo, o juiz:", "alt": {"A": "Não pode fazer nada de ofício, dependendo sempre de exceção formal oposta pela parte interessada.", "B": "Deve declarar-se suspeito ou impedido de ofício, dando por certo o motivo alegado e remetendo o processo ao substituto legal.", "C": "Deve consultar o Tribunal antes de qualquer manifestação sobre sua própria suspeição.", "D": "Só pode declarar-se suspeito se houver expressa concordância do Ministério Público."}, "gabarito": "B", "fb": {"A": "Incorreta. O próprio juiz PODE e DEVE agir de ofício quando reconhece, em si mesmo, motivo de impedimento ou suspeição — não precisa aguardar provocação da parte.", "B": "Correta! Art. 97, CPP: o juiz que reconhecer motivo de impedimento ou suspeição deverá declarar-se de ofício, seguindo-se o processamento devido (remessa dos autos ao substituto legal, na forma dos arts. 98 e 99, CPP).", "C": "Incorreta. Não há necessidade de consulta prévia ao Tribunal para essa autodeclaração.", "D": "Incorreta. Não há exigência de concordância do MP para o juiz reconhecer sua própria suspeição."}, "fund": "Art. 97, CPP.", "caqui": "A imparcialidade do julgador é garantia tão fundamental que a lei não deixa isso na mão exclusiva das partes: o próprio juiz tem o DEVER de se autodeclarar suspeito ou impedido assim que percebe o motivo, independentemente de qualquer provocação. É uma manifestação do dever de lealdade e boa-fé processual que recai também sobre o magistrado."}, {"num": 7, "exame": "OAB – estilo FGV", "titulo": "Exceção de Incompetência de Juízo", "enunciado": "A defesa entende que o juiz da causa é territorialmente incompetente para julgar o feito e deseja argüir essa incompetência.", "comando": "Segundo o CPP, a exceção de incompetência de juízo:", "alt": {"A": "Só pode ser oposta por escrito, sendo vedada a forma oral.", "B": "Pode ser oposta, verbalmente ou por escrito, no prazo de defesa, e, se reconhecida, os autos serão remetidos ao juízo competente.", "C": "Uma vez oposta, extingue definitivamente a ação penal, exigindo-se novo oferecimento da denúncia.", "D": "Só pode versar sobre incompetência em razão da matéria, nunca sobre incompetência territorial."}, "gabarito": "B", "fb": {"A": "Incorreta. O CPP admite a oposição verbal ou escrita.", "B": "Correta! Art. 108, CPP: a exceção de incompetência do juízo poderá ser oposta, verbalmente ou por escrito, no prazo de defesa. Se reconhecida a incompetência, os autos serão remetidos ao juízo competente, aproveitando-se os atos praticados, salvo os decisórios (aplicação do art. 108, §1º/§2º c/c princípio da conservação dos atos processuais).", "C": "Incorreta. Não há extinção da ação penal — apenas a remessa ao juízo correto, com aproveitamento, em regra, dos atos já praticados que não dependam da competência específica.", "D": "Incorreta. A exceção de incompetência pode versar sobre qualquer critério de fixação de competência (territorial, material, funcional), não havendo essa restrição."}, "fund": "Art. 108, caput e §§1º e 2º, CPP.", "caqui": "No processo penal, diferente do processo civil (onde há uma peça específica mais formal), a exceção de incompetência pode ser oposta de forma mais simples — até verbalmente — dentro do prazo de defesa. E o reconhecimento da incompetência NÃO anula tudo: os atos processuais já praticados, em regra, são aproveitados no juízo competente, exceto os de natureza decisória."}, {"num": 8, "exame": "CESPE – estilo", "titulo": "Litispendência e Coisa Julgada", "enunciado": "Descobre-se que, contra o mesmo acusado, pelo mesmo fato, já tramita outro processo penal em outra vara, ou que já há sentença penal transitada em julgado sobre idêntica imputação.", "comando": "Segundo o CPP, as exceções de litispendência e de coisa julgada:", "alt": {"A": "Só podem ser argüidas no prazo de defesa, sob pena de preclusão, assim como a suspeição.", "B": "Podem ser argüidas a todo tempo, em qualquer fase do processo, dada a gravidade de processar ou punir alguém duas vezes pelo mesmo fato.", "C": "Só podem ser reconhecidas de ofício pelo juiz, sendo vedada sua argüigição pelas partes.", "D": "Não são aplicáveis ao processo penal, sendo exclusivas do processo civil."}, "gabarito": "B", "fb": {"A": "Incorreta. Diferente da suspeição (que tem momento preclusivo), a litispendência e a coisa julgada podem ser suscitadas a qualquer momento.", "B": "Correta! Art. 110, caput, CPP: as exceções de litispendência e de coisa julgada poderão ser opostas de qualquer das partes, em qualquer termo do processo, e devem ser imediatamente solucionadas pelo juiz. Isso decorre da gravidade da garantia contra o duplo julgamento pelo mesmo fato (ne bis in idem).", "C": "Incorreta. Podem ser reconhecidas de ofício E TAMBÉM suscitadas pelas partes — não há essa exclusividade.", "D": "Incorreta. São expressamente previstas no CPP (art. 95) como exceções aplicáveis ao processo penal."}, "fund": "Art. 110, caput, CPP.", "caqui": "Diferencie o “relaxamento” de prazo: SUSPEIÇÃO tem momento certo para ser oposta (art. 96), sob pena de preclusão. Já LITISPENDÊNCIA e COISA JULGADA, por envolverem garantias fundamentais contra bis in idem, podem ser alegadas A QUALQUER TEMPO do processo — não precluem."}, {"num": 9, "exame": "OAB – estilo FGV", "titulo": "Exceção de Ilegitimidade de Parte", "enunciado": "Uma denúncia foi oferecida pelo Ministério Público em crime de ação penal exclusivamente privada, sem que a vítima tenha oferecido queixa-crime.", "comando": "Nessa hipótese, a defesa pode arguir:", "alt": {"A": "Exceção de suspeição do Ministério Público.", "B": "Exceção de ilegitimidade de parte, já que o MP não é parte legítima para promover ação penal privada.", "C": "Exceção de litispendência, pois haveria dois processos idênticos.", "D": "Exceção de incompetência de juízo, já que apenas o critério de competência estaria em jogo."}, "gabarito": "B", "fb": {"A": "Incorreta. Não se trata de imparcialidade do órgão do MP, mas de sua LEGITIMIDADE para figurar como autor da ação penal privada.", "B": "Correta! Art. 95, V c/c art. 110/111, CPP: quando quem promove a ação não tem legitimidade (capacidade de ser parte naquele tipo de ação), cabe a exceção de ILEGITIMIDADE DE PARTE. No caso, o MP não é parte legítima para promover ação penal exclusivamente privada, que é prerrogativa da vítima ou de seu representante legal, via queixa-crime.", "C": "Incorreta. Não há dois processos idênticos em curso — o problema é quem PÔDE promover a ação, não duplicidade processual.", "D": "Incorreta. O problema não é de competência (qual juízo julga), mas de LEGITIMIDADE (quem pode propor a ação)."}, "fund": "Art. 95, V, CPP; princípios gerais sobre ação penal privada (arts. 30 e 100, §2º, CP).", "caqui": "A ilegitimidade de parte no processo penal aparece principalmente em duas situações: (1) MP oferece denúncia em crime de ação penal EXCLUSIVAMENTE PRIVADA (ilegitimidade ativa do MP); (2) queixa-crime oferecida por quem não é o ofendido ou seu representante legal. Fixe: legitimidade é sobre QUEM PODE PROPOR a ação — não confunda com competência (QUAL JUÍZO julga) nem com suspeição (IMPARCIALIDADE do julgador ou do MP)."}, {"num": 10, "exame": "CESPE – estilo", "titulo": "Incompatibilidades e Impedimentos", "enunciado": "O art. 112 do CPP determina que juiz, órgão do Ministério Público, serventuários ou funcionários da justiça devem abster-se de servir no processo em determinadas circunstâncias.", "comando": "Segundo esse dispositivo, isso ocorre:", "alt": {"A": "Somente quando houver expressa provocação das partes, nunca de ofício.", "B": "Quando ocorrer motivo de impedimento ou suspeição, dando-se por certo o motivo alegado, salvo, quanto a serventuários e funcionários, se não for possível a substituição imediata.", "C": "Apenas em relação ao juiz, não se aplicando a membros do Ministério Público ou serventuários.", "D": "Somente nos processos de competência do Tribunal do Júri."}, "gabarito": "B", "fb": {"A": "Incorreta. A abstenção pode e deve ocorrer de ofício, por dever do próprio agente público.", "B": "Correta! Art. 112, CPP: o juiz, o órgão do Ministério Público, os serventuários ou funcionários de justiça abster-se-ão de servir no processo, quando ocorrer motivo de impedimento ou suspeição, dando por certo o motivo alegado, salvo, quanto aos serventuários e funcionários, se não for possível a substituição imediata.", "C": "Incorreta. O dispositivo abrange explicitamente juiz, MP, serventuários E funcionários da justiça.", "D": "Incorreta. Não há essa restrição ao Júri — aplica-se a todo e qualquer processo penal."}, "fund": "Art. 112, CPP.", "caqui": "Esse artigo amplia o dever de imparcialidade para ALÉM do juiz: também membros do MP, serventuários e funcionários da justiça devem se abster quando impedidos ou suspeitos. A única flexibilização prática é para serventuários/funcionários: se não houver como substituí-los imediatamente (ex.: pequena comarca com um único escrevão), a lei tolera a continuidade, dada a necessidade de não paralisar o serviço judiciário."}, {"num": 11, "exame": "OAB – estilo FGV", "titulo": "Conflito de Competência – Legitimidade para Suscitar", "enunciado": "Dois juizes criminais de comarcas diferentes divergem sobre qual deles é competente para julgar determinado processo, cada um se declarando incompetente (conflito negativo).", "comando": "Segundo o CPP, o conflito de jurisdição pode ser suscitado por:", "alt": {"A": "Exclusivamente pelas partes interessadas, nunca de ofício pelos próprios juizes.", "B": "Qualquer dos juizes ou tribunais interessados, pela parte interessada, ou pelo Ministério Público.", "C": "Somente pelo Procurador-Geral de Justiça, mediante manifestação formal.", "D": "Apenas pelo Tribunal de Justiça, de ofício, após provocação do Conselho Nacional de Justiça."}, "gabarito": "B", "fb": {"A": "Incorreta. Os próprios juizes/tribunais interessados podem suscitar o conflito, além das partes e do MP.", "B": "Correta! Art. 116, CPP: o conflito poderá ser suscitado por qualquer das partes interessadas, pelo Ministério Público, ou por qualquer dos juizes ou tribunais em causa.", "C": "Incorreta. Não é exclusividade do Procurador-Geral — qualquer membro do MP com atribuição pode suscitar, assim como as partes e os próprios juízos.", "D": "Incorreta. Não há essa exclusividade do Tribunal de Justiça nem dependência do CNJ para suscitar o conflito."}, "fund": "Art. 116, CPP.", "caqui": "Legitimados para suscitar conflito de jurisdição: as PARTES interessadas, o MINISTÉRIO PÚBLICO, e os próprios JUÍZES/TRIBUNAIS envolvidos no conflito. É um rol amplo, porque a definição correta do juízo competente interessa a todos os envolvidos no processo, não apenas às partes."}, {"num": 12, "exame": "CESPE – estilo", "titulo": "Restituição de Coisas Apreendidas – Requisitos", "enunciado": "José teve um veículo apreendido no curso de um inquérito policial e, após a conclusão das investigações preliminares, requer sua restituição.", "comando": "Segundo o CPP e a jurisprudência consolidada, a restituição de coisas apreendidas depende de quais requisitos cumulativos?", "alt": {"A": "Apenas o requerimento formal do interessado, independentemente de qualquer outra condição.", "B": "Demonstração cabal da propriedade do bem, ausência de interesse na manutenção da apreensão para a instrução processual, e não estar o bem sujeito à pena de perdimento.", "C": "Apenas a demonstração de propriedade do bem, sendo os demais requisitos dispensáveis.", "D": "Trânsito em julgado de sentença absolutória, sendo vedada a restituição antes disso em qualquer hipótese."}, "gabarito": "B", "fb": {"A": "Incorreta. O mero requerimento não basta — há requisitos materiais cumulativos a demonstrar.", "B": "Correta! Conforme os arts. 118 e 120, CPP, e jurisprudência consolidada do STJ, a restituição de coisas apreendidas condiciona-se a três requisitos: (1) demonstração cabal da propriedade do bem pelo requerente (art. 120, caput); (2) ausência de interesse no curso do inquérito ou da instrução judicial na manutenção da apreensão (art. 118); e (3) não estar o bem sujeito à pena de perdimento (art. 91, II, CP).", "C": "Incorreta. Todos os três requisitos são cumulativos, não apenas a propriedade.", "D": "Incorreta. É possível a restituição ANTES do trânsito em julgado, inclusive ainda no curso do inquérito, desde que preenchidos os requisitos e não haja mais interesse probatório na apreensão."}, "fund": "Arts. 118 e 120, CPP; art. 91, II, CP; jurisprudência do STJ.", "caqui": "Memorize os 3 requisitos com o mnemônico <b>P-I-P</b>: Propriedade cabal e demonstrada; ausência de Interesse probatório na manutenção da apreensão; não sujeito a Perdimento (art. 91, II, CP — instrumentos do crime cujo uso, porte ou fabrico sejam ilícitos, ou produto/proveito do crime). Faltando qualquer um dos três, a restituição é negada."}, {"num": 13, "exame": "OAB – estilo FGV", "titulo": "Bens de Propriedade Ilícita ou Apreensão de Instrumento do Crime", "enunciado": "Uma arma de fogo utilizada na prática de um crime foi apreendida. O proprietário da arma, que possui registro regular, requer sua restituição após o encerramento do processo com condenação.", "comando": "Nessa hipótese, segundo o Código Penal e o CPP:", "alt": {"A": "A arma deve ser restituída automaticamente, pois o proprietário tem registro regular.", "B": "A arma pode estar sujeita a perdimento em favor da União, se caracterizado instrumento do crime cujo porte constitua fato ilícito ou cujo uso na infração assim justifique, na forma do art. 91, II, do Código Penal.", "C": "A arma deve ser sempre destruída, independentemente de qualquer decisão judicial específica.", "D": "A restituição é sempre obrigatória, salvo se o proprietário for reincidente."}, "gabarito": "B", "fb": {"A": "Incorreta. Ter registro regular não afasta, por si só, a possibilidade de perdimento quando o instrumento foi efetivamente utilizado na prática do crime, nos termos da lei penal.", "B": "Correta! Art. 91, II, ‘a’ e ‘b’, CP: é efeito da condenação a perda, em favor da União, dos instrumentos do crime, desde que consistam em coisas cujo fabrico, alienação, uso, porte ou detenção constitua fato ilícito, ou quando o instrumento tiver sido efetivamente empregado no crime e sua perda seja necessária para evitar riscos. Sendo o caso de perdimento, a restituição é obstada (art. 118, CPP).", "C": "Incorreta. Não há destruição automática sem decisão judicial fundamentada sobre o destino do bem apreendido.", "D": "Incorreta. Não há essa condicionante à reincidência — o critério legal é o do art. 91, II, CP, sobre a natureza ilícita do instrumento ou seu efetivo emprego no crime."}, "fund": "Art. 91, II, CP; art. 118, CPP.", "caqui": "A restituição de coisas apreendidas esbarra sempre na questão do perdimento: mesmo bens de origem lícita e com registro regular (como uma arma legalizada) podem ser objeto de perdimento se efetivamente usados como instrumento do crime, nos termos do art. 91, II, CP. É uma das exceções mais cobradas ao “direito automático” de reaver o que é seu."}, {"num": 14, "exame": "CESPE – estilo", "titulo": "Sequestro de Bens – Objeto", "enunciado": "Após investigação de crime de peculato, identifica-se que o servidor público investigado adquiriu um imóvel de luxo com valores desviados dos cofres públicos.", "comando": "Nessa hipótese, a medida assecuratória cabível para constringir esse imóvel é:", "alt": {"A": "A hipoteca legal, única medida assecuratória admitida sobre bens imóveis no CPP.", "B": "O sequestro, que recai sobre bens adquiridos com os proventos da infração, ainda que já tenham sido transferidos a terceiro.", "C": "O arresto, cabível apenas sobre bens móveis do indiciado, nunca sobre imóveis.", "D": "A busca e apreensão, medida cautelar probatória incompatível com a constrição patrimonial."}, "gabarito": "B", "fb": {"A": "Incorreta. A hipoteca legal recai sobre bens do indiciado de origem LÍCITA, para garantir eventual reparação do dano — diferente do sequestro, que recai sobre bens de origem ILÍCITA (proventos do crime).", "B": "Correta! Art. 125, CPP: caberá o sequestro dos bens imóveis, adquiridos pelo indiciado com os proventos da infração, ainda que já tenham sido transferidos a terceiro. O sequestro é justamente a medida voltada a bens de origem ILÍCITA (fruto do crime), diferentemente da hipoteca legal e do arresto, que recaem sobre bens de origem lícita do indiciado.", "C": "Incorreta. O arresto é medida SUBSIDIÁRIA à hipoteca legal, cabível sobre bens MÓVEIS de origem LÍCITA — não é o instrumento adequado para bens adquiridos com o produto do crime.", "D": "Incorreta. Busca e apreensão é medida distinta (meio de obtenção de prova ou apreensão de objetos), não sendo incompatível com medidas assecuratórias, mas não é a medida específica para esse fim de garantia patrimonial sobre bem imóvel fruto do crime."}, "fund": "Art. 125, CPP.", "caqui": "A pergunta-chave para escolher a medida assecuratória certa é: <b>de onde veio o bem?</b> Se veio DIRETAMENTE do crime (produto/proveito ilícito) → SEQUESTRO (arts. 125-133). Se é um bem de origem LÍCITA do próprio indiciado, usado para garantir a REPARAÇÃO DO DANO → HIPOTECA LEGAL (imóvel) ou ARRESTO (móvel, subsidiário à hipoteca)."}, {"num": 15, "exame": "OAB – estilo FGV", "titulo": "Hipoteca Legal e Arresto – Bens de Origem Lícita", "enunciado": "Um empresário, respondendo por crime que causou vultoso dano à vítima, possui um imóvel de origem inteiramente lícita, adquirido anos antes do crime, sobre o qual a vítima deseja assegurar futura reparação civil.", "comando": "A medida assecuratória adequada, nesse caso, é:", "alt": {"A": "O sequestro, pois qualquer bem do indiciado pode ser sequestrado, independentemente da origem.", "B": "A especialização e inscrição da hipoteca legal sobre o imóvel, ainda que de origem lícita, para garantir a reparação do dano causado pelo crime.", "C": "O arresto, única medida cabível sobre bens imóveis de origem lícita.", "D": "Nenhuma medida assecuratória é cabível sobre bens de origem lícita do indiciado."}, "gabarito": "B", "fb": {"A": "Incorreta. O sequestro exige que o bem tenha sido adquirido COM OS PROVENTOS DA INFRAÇÃO (origem ilícita) — não é aplicável a bens de origem lícita.", "B": "Correta! Arts. 134-135 (e seguintes), CPP: a hipoteca legal pode ser requerida pelo ofendido em qualquer fase do processo, desde que haja certeza da infração e indícios suficientes da autoria, incidindo sobre imóveis do indiciado, AINDA QUE de origem lícita, justamente para garantir a futura reparação do dano causado pelo crime.", "C": "Incorreta. O arresto é medida cabível sobre bens MÓVEIS (e, em caráter subsidiário/preparatório, também pode anteceder a hipoteca sobre imóveis antes da especialização), não sendo a medida primária para imóveis já identificados e especializáveis.", "D": "Incorreta. É exatamente o oposto: hipoteca legal e arresto EXISTEM justamente para alcançar bens de origem lícita do indiciado, com finalidade de garantir a reparação civil do dano."}, "fund": "Arts. 134 e seguintes, CPP.", "caqui": "Fixe o contraste final: SEQUESTRO = bem sujo (fruto do crime), qualquer natureza (móvel ou imóvel). HIPOTECA LEGAL = bem limpo (origem lícita), IMÓVEL, para garantir indenização civil. ARRESTO = bem limpo (origem lícita), MÓVEL (ou imóvel em caráter preparatório à hipoteca), mesma finalidade indenizatória."}, {"num": 16, "exame": "CESPE – estilo", "titulo": "Alienação Antecipada de Bens – Art. 144-A, CPP", "enunciado": "Veículos automotores apreendidos em uma operação policial estão sofrendo significativa depreciação e deterioração por ficarem parados em pátio, aguardando o desfecho do processo criminal.", "comando": "Segundo o CPP e a jurisprudência do STJ, nessa hipótese:", "alt": {"A": "Os bens devem permanecer intocados até o trânsito em julgado, não havendo qualquer previsão legal de venda antes disso.", "B": "O juiz determinará a alienação antecipada dos bens para preservação de seu valor, com o produto da venda permanecendo vinculado ao juízo até a solução final do processo.", "C": "Os bens devem ser doados imediatamente a instituições de caridade, independentemente de decisão judicial.", "D": "Somente após a condenação transitada em julgado é possível qualquer disposição sobre os bens apreendidos."}, "gabarito": "B", "fb": {"A": "Incorreta. O art. 144-A do CPP autoriza expressamente a alienação antecipada quando há risco de deterioração ou depreciação.", "B": "Correta! Art. 144-A, CPP (incluído pela Lei 12.694/2012): o juiz determinará a alienação antecipada para preservação do valor dos bens sempre que estiverem sujeitos a qualquer grau de deterioração ou depreciação, ou quando houver dificuldade para sua manutenção. A jurisprudência do STJ confirma que o produto da venda permanece vinculado ao juízo criminal, podendo ser restituído ao acusado em caso de absolvição.", "C": "Incorreta. Não há doação automática — a destinação é a alienação (venda, preferencialmente por leilão eletrônico) com o valor depositado à disposição do juízo.", "D": "Incorreta. É exatamente o oposto — a alienação antecipada existe PRECISAMENTE para evitar que se espere o trânsito em julgado (que pode levar anos), preservando o valor econômico do bem."}, "fund": "Art. 144-A, caput e §§1º e 2º, CPP, incluído pela Lei 12.694/2012.", "caqui": "O art. 144-A resolve um problema prático grave: processos criminais podem durar anos, e bens apreendidos (carros, imóveis, mercadorias) perdem valor com o tempo parado em depósito. A solução é vender antecipadamente (preferencialmente em leilão eletrônico) e manter o DINHEIRO — que não se deteriora — à disposição do juízo até o final do processo. Se o réu for absolvido, recebe o valor da venda; se condenado, o dinheiro segue a destinação legal do bem constrito."}, {"num": 17, "exame": "OAB – estilo FGV", "titulo": "Uso de Bem Apreendido por Órgãos de Segurança Pública (Pacote Anticrime)", "enunciado": "Uma arma de fogo e um veículo apreendidos em operação policial, sujeitos a medida assecuratória, poderiam ser utilizados operacionalmente por órgãos de segurança pública durante a tramitação do processo.", "comando": "Segundo o CPP, com as alterações da Lei 13.964/2019 (Pacote Anticrime), essa utilização:", "alt": {"A": "é vedada, pois bens sob medida assecuratória não podem ser utilizados por ninguém até o final do processo.", "B": "é permitida: o juiz poderá autorizar, constatado o interesse público, a utilização de bem sequestrado, apreendido ou sujeito a qualquer medida assecuratória pelos órgãos de segurança pública, do sistema prisional, do sistema socioeducativo, da Força Nacional de Segurança Pública e do Instituto Geral de Perícia.", "C": "é permitida apenas após o trânsito em julgado da sentença condenatória.", "D": "depende de autorização do Congresso Nacional, mediante decreto legislativo específico."}, "gabarito": "B", "fb": {"A": "Incorreta. A Lei 13.964/2019 passou a permitir expressamente essa utilização.", "B": "Correta! Art. 133-A, CPP (incluído pela Lei 13.964/2019 — Pacote Anticrime): o juiz poderá autorizar, constatado o interesse público, a utilização de bem sequestrado, apreendido ou sujeito a qualquer medida assecuratória pelos órgãos de segurança pública previstos no art. 144 da CF, do sistema prisional, do sistema socioeducativo, da Força Nacional de Segurança Pública e do Instituto Geral de Perícia, para o desempenho de suas atividades. O §1º dá prioridade ao órgão que participou da investigação/repressão que gerou a constrição do bem.", "C": "Incorreta. Não há essa exigência de aguardar o trânsito em julgado — a autorização pode ser concedida durante a tramitação do processo, mediante decisão judicial fundamentada no interesse público.", "D": "Incorreta. Não há essa exigência de decreto legislativo — a decisão é do próprio juiz da causa."}, "fund": "Art. 133-A, caput e §§1º e 2º, CPP, incluído pela Lei 13.964/2019 (Pacote Anticrime).", "caqui": "Essa é uma NOVIDADE muito relevante do Pacote Anticrime: antes, armas, veículos e outros bens apreendidos ficavam “parados” em depósitos policiais por anos, se deteriorando, enquanto a própria polícia poderia estar precisando de equipamento. Agora, comprovado o interesse público, o juiz pode autorizar o USO OPERACIONAL desses bens pelos órgãos de segurança listados — com prioridade para quem participou da investigação que levou à apreensão."}, {"num": 18, "exame": "CESPE – estilo", "titulo": "Legitimidade para Requerer Medidas Assecuratórias", "enunciado": "O ofendido, em processo por crime patrimonial, deseja requerer a decretação de sequestro sobre bem imóvel do acusado, adquirido com o produto do crime.", "comando": "Segundo o CPP, o sequestro de bens imóveis pode ser decretado:", "alt": {"A": "Exclusivamente de ofício pelo juiz, sendo vedado a requerimento das partes.", "B": "Em qualquer fase do processo ou ainda antes de oferecida a denúncia ou queixa, a requerimento do Ministério Público, do ofendido ou mediante representação da autoridade policial.", "C": "Somente após o trânsito em julgado da sentença condenatória.", "D": "Apenas mediante ação civil autônoma proposta pelo ofendido perante o juízo cível."}, "gabarito": "B", "fb": {"A": "Incorreta. O sequestro pode ser decretado tanto de ofício quanto a requerimento do MP, do ofendido, ou mediante representação da autoridade policial.", "B": "Correta! Art. 127, CPP: o juiz, de ofício, a requerimento do Ministério Público ou do ofendido, ou mediante representação da autoridade policial, poderá ordenar o sequestro, em qualquer fase do processo ou ainda antes de oferecida a denúncia ou queixa.", "C": "Incorreta. O sequestro é medida CAUTELAR, cabível justamente ANTES do trânsito em julgado, para assegurar o resultado útil do processo.", "D": "Incorreta. Não há necessidade de ação civil autônoma — o sequestro é medida processada nos próprios autos ou em apenso ao processo criminal."}, "fund": "Art. 127, CPP.", "caqui": "Legitimados a provocar o sequestro: JUIZ (de ofício), MP, OFENDIDO (requerimento), e AUTORIDADE POLICIAL (por representação — não decreta diretamente, apenas sugere ao juiz). E pode ser pedido até ANTES de oferecida a denúncia, já na fase de inquérito — não precisa esperar o processo começar formalmente."}, {"num": 19, "exame": "OAB – estilo FGV", "titulo": "Incidente de Falsidade Documental", "enunciado": "No curso de um processo penal, a defesa alega que um documento juntado pela acusação é materialmente falso, requerendo a instauração de incidente de falsidade.", "comando": "Segundo o CPP, a instauração do incidente de falsidade documental:", "alt": {"A": "Suspende obrigatoriamente o curso do processo principal até a decisão final sobre a falsidade.", "B": "Não suspende o curso do processo principal, sendo processada em apartado.", "C": "Extingue automaticamente a ação penal, independentemente do resultado do incidente.", "D": "Só pode ser suscitada pelo Ministério Público, nunca pela defesa."}, "gabarito": "B", "fb": {"A": "Incorreta. Diferente das questões prejudiciais do art. 92, o incidente de falsidade NÃO suspende o processo principal.", "B": "Correta! Arts. 145 a 148, CPP: o incidente de falsidade é autuado em apartado, após manifestação das partes e, se necessário, perícia, sendo a decisão sobre a falsidade proferida SEM suspender o processo principal (que continua tramitando normalmente, ressalvada a possibilidade de o juiz avaliar a prova em conjunto ao final).", "C": "Incorreta. O incidente de falsidade NÃO extingue automaticamente a ação penal — apenas resolve se aquele documento específico é ou não falso, para fins de valoração probatória.", "D": "Incorreta. Tanto a acusação quanto a defesa (e o próprio juiz, de ofício) podem suscitar o incidente de falsidade."}, "fund": "Arts. 145 a 148, CPP.", "caqui": "Pegadinha clássica de prova: diferente da questão prejudicial de estado civil (art. 92, que SUSPENDE o processo), o incidente de falsidade documental corre em APARTADO, SEM suspender o processo principal. A lógica é: a falsidade de um documento específico é apenas uma questão probatória pontual, que não justifica paralisar toda a marcha processual."}, {"num": 20, "exame": "CESPE – estilo", "titulo": "Efeitos da Decisão no Incidente de Falsidade", "enunciado": "Após regular instrução do incidente de falsidade, o juiz reconhece que o documento impugnado é realmente falso.", "comando": "Segundo o CPP, essa decisão proferida no incidente de falsidade:", "alt": {"A": "Faz coisa julgada material, vinculando definitivamente qualquer processo futuro sobre o mesmo documento.", "B": "Não faz coisa julgada em relação a processo posterior, seja civil, seja penal, versando sobre a falsidade do mesmo documento.", "C": "Gera automaticamente a instauração de inquérito por crime de falsidade documental, sem necessidade de qualquer outra providência.", "D": "Deve ser obrigatoriamente referendada pelo Tribunal antes de produzir qualquer efeito no processo."}, "gabarito": "B", "fb": {"A": "Incorreta. É exatamente o oposto do que dispõe o CPP.", "B": "Correta! Art. 148, CPP: a decisão do incidente de falsidade NÃO fará coisa julgada em relação a processo posterior. Ou seja, mesmo reconhecida a falsidade (ou a autenticidade) do documento naquele incidente, essa conclusão pode ser reexaminada em outro processo (civil ou penal) que trate especificamente do tema.", "C": "Incorreta. Não há essa automaticidade — a apuração de eventual crime de falsidade documental seguiria as vias próprias (representação, notícia-crime), não decorre automaticamente do incidente processual.", "D": "Incorreta. Não há exigência de referendo do Tribunal para a decisão do incidente de falsidade produzir efeitos no processo em que foi suscitada."}, "fund": "Art. 148, CPP.", "caqui": "Essa é a razão pela qual o incidente de falsidade é tratado como questão de natureza mais restrita/instrumental: a decisão vale apenas para os EFEITOS DAQUELE PROCESSO ESPECÍFICO (uso probatório do documento), sem produzir coisa julgada material sobre a falsidade em si para outros fins. Diferente, por exemplo, da coisa julgada penal sobre autoria e materialidade de um crime."}, {"num": 21, "exame": "OAB – estilo FGV", "titulo": "Incidente de Insanidade Mental – Instauração", "enunciado": "Durante a instrução de um processo penal, surgem dúvidas sérias sobre a integridade mental do acusado à época dos fatos e no momento processual atual.", "comando": "Segundo o CPP, a instauração do incidente de insanidade mental pode ser determinada:", "alt": {"A": "Apenas de ofício pelo juiz, sendo vedada a provocação pelas partes.", "B": "De ofício, ou a requerimento do Ministério Público, do defensor, do curador, do cônjuge, ascendente, descendente ou irmão do acusado.", "C": "Somente por provocação da defesa técnica, mediante laudo particular prévio.", "D": "Exclusivamente na fase de execução penal, após a condenação definitiva."}, "gabarito": "B", "fb": {"A": "Incorreta. As partes também têm legitimidade para requerer a instauração do incidente.", "B": "Correta! Art. 149, §1º, CPP: o exame poderá ser ordenado ainda na fase do inquérito policial, mediante representação da autoridade policial ao juiz competente; e o juiz poderá determinar a instauração, de ofício ou a requerimento do Ministério Público, do defensor, do curador, do cônjuge, ascendente, descendente ou irmão do acusado.", "C": "Incorreta. Não há essa exigência de laudo particular prévio como condição para instaurar o incidente oficial.", "D": "Incorreta. Pode ser instaurado durante o PROCESSO DE CONHECIMENTO (fase de instrução), não apenas na execução penal."}, "fund": "Art. 149, caput e §1º, CPP.", "caqui": "Rol amplo de legitimados: JUIZ (de ofício), MP, DEFENSOR, CURADOR (se já nomeado), e FAMÍLIA PRÓXIMA (cônjuge, ascendente, descendente, irmão). A lógica é proteger o acusado que pode não ter plena capacidade de se autodefender ou perceber sua própria condição — por isso a lei dá legitimidade também a pessoas próximas dele, mesmo que não sejam partes formais do processo."}, {"num": 22, "exame": "CESPE – estilo", "titulo": "Suspensão do Processo no Incidente de Insanidade Mental", "enunciado": "Instaurado o incidente de insanidade mental, o processo criminal principal é suspenso.", "comando": "Segundo o CPP, essa suspensão alcança:", "alt": {"A": "Tanto o inquérito policial quanto o processo judicial, paralisando toda e qualquer investigação.", "B": "Apenas o processo, ficando o inquérito policial autorizado a prosseguir, sob direção da autoridade policial.", "C": "Nem o processo, nem o inquérito, já que a insanidade mental não gera suspensão em nenhuma hipótese.", "D": "Apenas os prazos recursais, mantendo-se normalmente os atos de instrução."}, "gabarito": "B", "fb": {"A": "Incorreta. O inquérito policial NÃO é suspenso — apenas o processo judicial.", "B": "Correta! Art. 149, §2º, CPP: o exame NÃO será ordenado em fase de inquérito senão mediante representação, mas isso não suspende o inquérito, que prossegue normalmente. Instaurado o incidente na fase PROCESSUAL, art. 149, §2º, combinado com art. 152, CPP: instaurado o incidente, o processo (fase judicial) fica suspenso, prosseguindo, porém, quanto a atos que possam ser urgentes.", "C": "Incorreta. Há sim suspensão do processo judicial (com ressalva de atos urgentes) enquanto não resolvido o incidente.", "D": "Incorreta. A suspensão é mais ampla do que apenas prazos recursais — abrange, em regra, os próprios atos de instrução do processo."}, "fund": "Art. 149, §2º, e art. 152, CPP.", "caqui": "Fixe essa distinção processual importante: FASE DE INQUÉRITO = a investigação continua correndo mesmo com a representação para exame de insanidade. FASE PROCESSUAL (ação penal já em curso) = o processo fica SUSPENSO enquanto se apura a insanidade, ressalvados atos urgentes e a possibilidade de produção antecipada de provas que possam perecer."}, {"num": 23, "exame": "OAB – estilo FGV", "titulo": "Nomeação de Curador no Incidente de Insanidade Mental", "enunciado": "Instaurado o incidente de insanidade mental de acusado que não possui advogado constituído nem representante legal formalmente nomeado.", "comando": "Segundo o CPP, nessa hipótese o juiz deve:", "alt": {"A": "Arquivar o incidente até que a família do acusado providencie representante legal.", "B": "Nomear curador ao acusado, até a apresentação do laudo e ulterior deliberação sobre a capacidade processual.", "C": "Extinguir o processo sem resolução do mérito, por ausência de capacidade processual do acusado.", "D": "Determinar a internação compulsória imediata, independentemente do resultado do exame pericial."}, "gabarito": "B", "fb": {"A": "Incorreta. O incidente não fica arquivado aguardando providência da família — o próprio juiz nomeia curador.", "B": "Correta! Art. 149, §2º, CPP: o juiz nomeará curador ao acusado, quando determinar o exame, ficando este resguardado processualmente até que se conclua sobre sua capacidade e se estabeleça, se for o caso, a representação adequada no processo.", "C": "Incorreta. Não há extinção do processo apenas por instauração do incidente — a nomeação de curador é exatamente o mecanismo para permitir a continuidade regular do processo.", "D": "Incorreta. A internação (medida de segurança provisória) só pode ser determinada após laudo pericial que a justifique, e mediante os requisitos legais específicos, não de forma automática e imediata."}, "fund": "Art. 149, §2º, CPP.", "caqui": "A curatela processual é uma garantia básica: enquanto não se sabe se o acusado tem plena capacidade de entender e participar do processo, o juiz nomeia um CURADOR para zelar por seus interesses processuais até que o laudo pericial esclareça a situação — evitando que o processo avance à revelia de alguém que pode não estar em condições de se defender adequadamente."}, {"num": 24, "exame": "CESPE – estilo", "titulo": "Consequências da Constatação de Inimputabilidade", "enunciado": "Concluído o incidente de insanidade mental, constata-se que o acusado era, ao tempo do fato, inteiramente incapaz de entender o caráter ilícito de sua conduta, em razão de doença mental.", "comando": "Nesse caso, sendo essa a única tese e havendo prova do fato e da autoria, o desfecho processual adequado é:", "alt": {"A": "Absolvição própria, com extinção pura e simples da punição.", "B": "Absolvição imprópria, com aplicação de medida de segurança (internação ou tratamento ambulatorial), na forma do art. 26 do Código Penal.", "C": "Condenação normal, com cumprimento de pena privativa de liberdade em regime comum.", "D": "Extinção da punibilidade, sem qualquer consequência jurídica ao acusado."}, "gabarito": "B", "fb": {"A": "Incorreta. Embora a sentença seja formalmente absolutória, ela NÃO é uma absolvição “pura”, pois aplica medida de segurança — por isso é chamada de absolvição IMPRÓPRIA.", "B": "Correta! Art. 26, caput, CP, c/c art. 386, parágrafo único, e art. 397, CPP: reconhecida a inimputabilidade por doença mental à época do fato (art. 26, CP), com prova da materialidade e autoria, profere-se sentença de ABSOLVIÇÃO IMPRÓPRIA, aplicando-se medida de segurança (internação em hospital de custódia ou tratamento ambulatorial, conforme a gravidade e a periculosidade).", "C": "Incorreta. Não há condenação a pena privativa de liberdade quando reconhecida a inimputabilidade plena — a resposta estatal é a medida de segurança, de natureza distinta da pena.", "D": "Incorreta. Há sim consequência jurídica — a medida de segurança, ainda que não seja pena no sentido técnico."}, "fund": "Art. 26, caput, CP; art. 386, parágrafo único, III, e art. 397, CPP.", "caqui": "Não confunda: ABSOLVIÇÃO PRÓPRIA = o réu é absolvido e vai embora, sem qualquer consequência penal. ABSOLVIÇÃO IMPRÓPRIA = tecnicamente é uma “absolvição” (não há condenação à pena), mas o réu inimputável recebe MEDIDA DE SEGURANÇA (internação ou tratamento ambulatorial) — uma resposta estatal de natureza preventiva/terapêutica, não retributiva, mas ainda assim uma restrição. É o desfecho típico de quem, ao tempo do fato, era inteiramente incapaz de entender o caráter ilícito da conduta (art. 26, caput, CP)."}, {"num": 25, "exame": "OAB – estilo FGV", "titulo": "Questão Síntese – Questões e Processos Incidentes", "enunciado": "Sobre as questões e os processos incidentes no processo penal brasileiro, considerando o CPP com as alterações da Lei 12.694/2012 e da Lei 13.964/2019 (Pacote Anticrime), analise as afirmativas:\n\nI. A questão prejudicial sobre estado civil das pessoas gera suspensão obrigatória do processo penal.\nII. O rol de exceções do art. 95 do CPP inclui suspeição, incompetência de juízo, litispendência, ilegitimidade de parte e coisa julgada.\nIII. O sequestro recai sobre bens de origem lícita do indiciado, ao passo que a hipoteca legal recai sobre bens adquiridos com o produto do crime.\nIV. O juiz pode autorizar, havendo interesse público, a utilização de bem apreendido por órgãos de segurança pública, na forma do art. 133-A do CPP.", "comando": "Estão corretas apenas as afirmativas:", "alt": {"A": "I, II e IV.", "B": "I e III.", "C": "II e IV.", "D": "I, II, III e IV."}, "gabarito": "A", "fb": {"A": "Correta! I está correta (art. 92, CPP: questão de estado civil = suspensão obrigatória). II está correta (art. 95, CPP: rol das 5 exceções). IV está correta (art. 133-A, CPP, incluído pelo Pacote Anticrime). III está ERRADA, pois inverte os conceitos: SEQUESTRO recai sobre bens de origem ILÍCITA (produto do crime), e HIPOTECA LEGAL recai sobre bens de origem LÍCITA do indiciado.", "B": "Incorreta. III está errada, pelos motivos já explicados, e a alternativa também deixa de fora II e IV, que estão corretas.", "C": "Incorreta. Deixa de fora a afirmativa I, que está correta.", "D": "Incorreta. A afirmativa III está errada, invertendo os conceitos de sequestro e hipoteca legal."}, "fund": "Arts. 92, 95, 125 e 133-A, CPP.", "caqui": "Questão-síntese perfeita para revisar todo o tema: memorize sempre a pergunta “de onde veio o bem?” para diferenciar sequestro (bem SUJO, fruto do crime) de hipoteca legal/arresto (bem LIMPO, origem lícita, para garantir indenização civil). E não esqueça as duas grandes novidades legislativas do tema: art. 144-A (alienação antecipada, Lei 12.694/2012) e art. 133-A (uso de bem apreendido pelos órgãos de segurança, Lei 13.964/2019 — Pacote Anticrime)."}];
let cur=0,N=QUESTOES.length;
const E=Array(N).fill(null);
function init(){
  const nw=document.getElementById('nw'),ct=document.getElementById('ct');
  QUESTOES.forEach((q,i)=>{
    const b=document.createElement('button');
    b.className='nb'+(i===0?' active':'');b.textContent=i+1;b.onclick=()=>go(i);b.id='n'+i;nw.appendChild(b);
    const d=document.createElement('div');d.className='qc'+(i===0?' vis':'');d.id='c'+i;d.innerHTML=bc(q,i);ct.appendChild(d);
  });upd();us();
}
function bc(q,i){
  const al=Object.entries(q.alt).map(([l,t])=>`<button class="ab" onclick="resp(${i},'${l}',this)" data-l="${l}"><span class="all">${l}</span><span class="alt">${t}</span></button>`).join('');
  return `<div class="qh"><span class="qn">Questão ${q.num}</span>${q.exame?`<span class="qe">${q.exame}</span>`:''}</div><h2 class="qt">${q.titulo}</h2><div class="en">${q.enunciado}</div><p class="co">${q.comando}</p><div class="al" id="a${i}">${al}</div><div class="fb" id="f${i}"></div><div class="fu" id="u${i}"><h4>📖 Fundamento legal</h4>${q.fund}</div><div class="cx" id="x${i}"><h4>🍊 Explicação didática do Professor Caqui</h4>${q.caqui}</div><div class="ca"><div class="bg"><button class="btn az" id="bu${i}" onclick="tF(${i})">Ver fundamento legal</button><button class="btn cq" id="bx${i}" onclick="tX(${i})">Explicação do Prof. Caqui</button><button class="btn" id="br${i}" onclick="rst(${i})">↺ Tentar novamente</button></div><span class="st" id="s${i}"></span></div>`;
}
function resp(i,l,btn){
  if(E[i]!==null)return;E[i]=l;const q=QUESTOES[i];
  document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=true;if(b.dataset.l===q.gabarito)b.classList.add('cor');if(b.dataset.l===l&&l!==q.gabarito)b.classList.add('err');});
  const ok=l===q.gabarito,f=document.getElementById('f'+i);
  f.className='fb sh '+(ok?'ac':'er');f.innerHTML=`<strong>${ok?'✓ Correta!':'✗ Incorreta.'}</strong> ${q.fb[l]}`;
  document.getElementById('s'+i).textContent=ok?'Acerto!':'Gabarito: '+q.gabarito;
  document.getElementById('br'+i).className='btn sh';document.getElementById('bu'+i).className='btn az sh';document.getElementById('bx'+i).className='btn cq sh';
  const nb=document.getElementById('n'+i);nb.classList.remove('active');nb.classList.add(ok?'ok':'no');if(i===cur)nb.classList.add('active');us();
}
function tF(i){const b=document.getElementById('u'+i),t=document.getElementById('bu'+i),v=b.classList.contains('sh');b.className=v?'fu':'fu sh';t.textContent=v?'Ver fundamento legal':'Ocultar fundamento';}
function tX(i){const b=document.getElementById('x'+i),t=document.getElementById('bx'+i),v=b.classList.contains('sh');b.className=v?'cx':'cx sh';t.textContent=v?'Explicação do Prof. Caqui':'Ocultar explicação';}
function rst(i){
  E[i]=null;document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=false;b.className='ab';});
  document.getElementById('f'+i).className='fb';document.getElementById('u'+i).className='fu';
  document.getElementById('bu'+i).className='btn az';document.getElementById('bu'+i).textContent='Ver fundamento legal';
  document.getElementById('x'+i).className='cx';document.getElementById('bx'+i).className='btn cq';document.getElementById('bx'+i).textContent='Explicação do Prof. Caqui';
  document.getElementById('br'+i).className='btn';document.getElementById('s'+i).textContent='';
  document.getElementById('n'+i).className='nb'+(i===cur?' active':'');us();
}
function go(i){document.getElementById('c'+cur).classList.remove('vis');document.getElementById('n'+cur).classList.remove('active');cur=i;document.getElementById('c'+cur).classList.add('vis');document.getElementById('n'+cur).classList.add('active');upd();window.scrollTo({top:0,behavior:'smooth'});}
function nav(d){const n=cur+d;if(n>=0&&n<N)go(n);}
function upd(){document.getElementById('pi').textContent=(cur+1)+' de '+N;document.getElementById('bp').disabled=cur===0;document.getElementById('bn').disabled=cur===N-1;}
function us(){const r=E.filter(e=>e!==null).length,a=E.filter((e,i)=>e===QUESTOES[i].gabarito).length;document.getElementById('sc-t').textContent=r;document.getElementById('sc-a').textContent=a;document.getElementById('sc-e').textContent=r-a;const p=Math.round((r/N)*100);document.getElementById('pf').style.width=p+'%';document.getElementById('pl').textContent=r+' de '+N+' respondidas';}
init();
</script>
</body>
</html>
